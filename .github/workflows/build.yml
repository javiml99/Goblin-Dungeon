name: Test and build Windows
on:
  push:
    branches: [main, codex/windows-playable]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - name: PHP syntax
        run: find GoblinDungeon tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression tests
        run: php tests/regression.php
      - name: HTTP tests
        run: python3 tests/http_smoke.py
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test bundled runtime
        shell: pwsh
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GoblinDungeon-Windows
          path: |
            dist/GoblinDungeon-Windows.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoblinDungeon-Windows
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --title "Goblin Dungeon $TAG" --notes "Windows x64. Descarga el ZIP, extrae todos los archivos y abre GoblinDungeon.exe. Incluye PHP y SQLite."
